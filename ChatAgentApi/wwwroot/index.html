<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Chat MVP</title>
    <style>
        body {
            font-family: system-ui;
            max-width: 800px;
            margin: 30px auto
        }

        #chat {
            border: 1px solid #ddd;
            padding: 12px;
            min-height: 300px;
            white-space: pre-wrap
        }

        form {
            display: flex;
            gap: 8px;
            margin-top: 12px
        }

        input {
            flex: 1;
            padding: 10px
        }

        button {
            padding: 10px
        }
    </style>
</head>
<body>

    <h2>Chat MVP</h2>
    <div id="chat"></div>

    <form id="form">
        <input id="input" placeholder="Nhập câu hỏi..." autocomplete="off" />
        <button>Gửi</button>
    </form>

    <script src="/app.js"></script>
</body>
</html>
